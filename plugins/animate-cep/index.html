<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AniKit</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <!-- 主视图 -->
  <div class="view main-view" id="mainView">
    <!-- 连接状态 -->
    <div class="conn" id="conn">
      <span class="conn-dot" id="connDot"></span>
      <span class="conn-text" id="connText">未连接</span>
    </div>

    <!-- 导出模式 -->
    <div class="group">
      <div class="group-title">导出模式</div>
      <div class="seg" id="segMode">
        <button class="seg-item on" id="segFile" type="button">新文件</button>
        <button class="seg-item" id="segThumb" type="button">仅缩略图</button>
      </div>
      <div class="group-desc" id="modeDesc" style="display:none">不产生新 fla，直接导当前文档画面：静态 = 播放头当前帧；动态 = 起止帧范围，留空 = 全部帧（超上限自动截断）。库内 fla 自动绑定缩略图；库外导出到原文件旁边，自行导入。</div>
    </div>

    <!-- 画面 -->
    <div class="group">
      <div class="group-title">画面</div>
      <!-- 静态 / 动态 分段（2026-09-02 复验改回：有标题分组后不复选框——用户定「切换按钮更直观」） -->
      <div class="seg" id="seg">
        <button class="seg-item on" id="segStatic" type="button">静态</button>
        <button class="seg-item" id="segAnim" type="button">动态</button>
      </div>
      <!-- 帧范围（仅缩略图 + 动态时显示；1-based 含端点，留空 = 全部） -->
      <div class="row" id="rangeRow" style="display:none">
        <span class="row-label">帧</span>
        <input id="rangeStart" class="input" type="text" inputmode="numeric" placeholder="起" spellcheck="false">
        <span class="row-label">至</span>
        <input id="rangeEnd" class="input" type="text" inputmode="numeric" placeholder="止" spellcheck="false">
      </div>
      <!-- 舞台尺寸（新 fla）：比例档 = 固定像素表（长边 1280 基准，点档直接用表值，2026-09-06 用户定）；
           像素框两框都填 = 直定尺寸（覆盖档值并去选中）；「自适应」= 按元件自身尺寸建新文档 -->
      <div class="seg" id="segRatio">
        <button class="seg-item on" data-ratio="" type="button" title="按元件自身尺寸建新文档">自适应</button>
        <button class="seg-item" data-ratio="16:9" type="button">16:9</button>
        <button class="seg-item" data-ratio="4:3" type="button">4:3</button>
        <button class="seg-item" data-ratio="1:1" type="button">1:1</button>
        <button class="seg-item" data-ratio="3:4" type="button">3:4</button>
        <button class="seg-item" data-ratio="9:16" type="button">9:16</button>
      </div>
      <div class="row" id="pixelRow" title="自定义舞台尺寸（像素，两框都填才生效）">
        <input id="sizeW" class="input" type="text" inputmode="numeric" placeholder="宽 px" spellcheck="false">
        <span class="row-label">×</span>
        <input id="sizeH" class="input" type="text" inputmode="numeric" placeholder="高 px" spellcheck="false">
      </div>
      <!-- 对齐方式（保持坐标 = fla 保原坐标，与发送至 AN 原位粘贴联动；合适舞台 = 缩放居中态直存，拆素材用） -->
      <div class="seg" id="segAlign">
        <button class="seg-item on" id="segKeep" type="button">保持坐标</button>
        <button class="seg-item" id="segFit" type="button">合适舞台</button>
      </div>
    </div>

    <!-- 入库 -->
    <div class="group" id="groupInbox">
      <div class="group-title">入库</div>
      <!-- 多选方式（2026-09-06）：分别建立 = 逐项批量导（命名框作前缀）；整合到一个文档 = 多选整体导一个 fla。
           仅 file 模式可见（thumb 模式随 groupInbox 隐藏） -->
      <div class="seg" id="segMerge">
        <button id="segSplit" class="seg-item on" type="button">分别建立</button>
        <button id="segMergeOne" class="seg-item" type="button">整合到一个文档</button>
      </div>
      <!-- 命名行：输入框 + 中文辅助钮（多选批量时内容作前缀，自动加 -序号） -->
      <div class="row" id="nameRow">
        <input id="name" class="input" type="text" placeholder="命名（多选 = 前缀+序号）" spellcheck="false">
        <button id="btnZh" class="icon-btn" type="button" title="中文输入（系统输入法）">中</button>
      </div>
      <!-- 目标文件夹（点击切树选择页） -->
      <button id="btnFolder" class="folder-btn" type="button">
        <span class="folder-label">目标</span>
        <span class="folder-value" id="folderValue">未分类</span>
        <span class="folder-caret">▾</span>
      </button>
    </div>

    <!-- 导出 -->
    <button id="btnExport" class="primary" type="button" disabled>导出</button>

    <!-- 状态区 -->
    <div class="status" id="status"></div>

    <!-- 导出设置（2026-09-06：只读参数行改面板可编辑——失焦/回车校验保存，
         APP 校验写盘后广播 settings 回显；失败 settingsError 回滚。断连禁用，welcome 解除） -->
    <div class="group" id="groupSettings">
      <div class="group-title">导出设置</div>
      <div class="row">
        <span class="row-label">时长</span>
        <input id="cfgSecs" class="input" type="text" inputmode="numeric" placeholder="10" spellcheck="false">
        <span class="row-label row-unit">秒</span>
      </div>
      <div class="row">
        <span class="row-label">大小</span>
        <input id="cfgBytes" class="input" type="text" inputmode="numeric" placeholder="2" spellcheck="false">
        <span class="row-label row-unit">MB</span>
      </div>
      <div class="row">
        <span class="row-label">帧率</span>
        <input id="cfgFps" class="input" type="text" inputmode="numeric" placeholder="跟随文档" spellcheck="false">
      </div>
      <div class="group-desc">新建 fla 文档的帧率，留空 = 跟随当前文档；时长与大小是动态 WebP 上限</div>
    </div>
  </div>

  <!-- 树选择视图（tab 页切换，不遮挡主视图） -->
  <div class="view tree-view" id="treeView">
    <div class="tree-head">
      <button class="tree-back" id="treeBack" type="button">‹</button>
      <span class="tree-title">选择目标文件夹</span>
    </div>
    <div class="tree-body" id="treeBody"></div>
    <button class="tree-cancel" id="treeCancel" type="button">取消</button>
  </div>

  <script src="js/CSInterface.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
