[package]
name = "promptmd"
version = "0.1.0"
description = "PromptMD - 提示词 Markdown 编辑器"
edition = "2021"
rust-version = "1.80"

[lib]
name = "promptmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"

[profile.dev]
opt-level = 1
incremental = false

[profile.dev.package."*"]
opt-level = 2
