[package]
name = "semantic-siglip-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
anyhow = "1.0.100"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "api-24", "directml", "load-dynamic"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokenizers = { version = "0.22.1", default-features = false, features = ["fancy-regex"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
debug = 1
