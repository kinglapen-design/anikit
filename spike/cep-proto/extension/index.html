<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AniKit spike</title>
<style>
  body { margin: 0; padding: 10px; background: #1b1b1c; color: #d7d7da;
         font: 12px/1.6 "Microsoft YaHei", sans-serif; user-select: none; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex: none; }
  .dot.on { background: #4caf7d; }
  button { flex: 1; padding: 6px 0; background: #333338; color: #d7d7da;
           border: 1px solid #4a4a52; border-radius: 4px; cursor: pointer; }
  button:hover { background: #3e3e46; }
  button:disabled { opacity: .4; cursor: default; }
  input { flex: 1; min-width: 0; padding: 4px 6px; background: #242428; color: #d7d7da;
          border: 1px solid #4a4a52; border-radius: 4px; }
  #log { height: 220px; overflow-y: auto; background: #141415; border-radius: 4px;
         padding: 6px; font: 11px/1.5 Consolas, monospace; white-space: pre-wrap;
         word-break: break-all; user-select: text; }
  .dim { color: #8a8a92; }
</style>
</head>
<body>
  <div class="row"><span id="dot" class="dot"></span><span id="conn" class="dim">未连接</span></div>
  <div class="row"><input id="name" placeholder="名称（默认取元件名）"></div>
  <div class="row">
    <button id="btn-info">读取选中元件</button>
  </div>
  <div class="row">
    <button id="btn-static">导出静图</button>
    <button id="btn-anim">导出动图</button>
  </div>
  <div class="row">
    <button id="btn-open">打开输出目录</button>
  </div>
  <div id="log"></div>
  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
