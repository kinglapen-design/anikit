[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
drag = "2.1.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-dialog = "2"
# 主窗口 1px 线框色（DWMWA_BORDER_COLOR，Win11+）+ 收件箱盘符（DefineDosDeviceW，3.2）
# + 收件箱占用探测（CreateFileW 的 SECURITY_ATTRIBUTES 参数要求 Win32_Security，3.2）
# + 4.2 格式图标保底（IShellItemImageFactory 取系统图标 → GetDIBits 转 RGBA；COM 初始化为 STA）
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com"] }
# 数据层：时间戳（ID / importedAt / 备份命名）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 数据层：ID 随机字符
rand = "0.8"
# 全局配置目录（Windows %APPDATA%）
dirs = "5"
# 阶段 3：导入 hash 查重（sha256）
sha2 = "0.10"
# 阶段 3：图片宽高探测与缩略图生成（裁剪特性控制体积）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# 阶段 3：有损 webp 缩略图编码（libwebp 官方绑定 q=80；image crate 的 WebPEncoder 只支持无损，体积差 5 倍）
webp = { version = "0.3", default-features = false }
# 阶段 3：剪贴板图片读取（剪贴板导入）
arboard = "3"
# 阶段 3：导入管线并行（sha256 / 复制 / 缩略图多线程，rayon 数据并行标准方案）
rayon = "1"
# 阶段 3.2：收件箱目录监听（Windows 走 ReadDirectoryChangesW 增量事件，非轮询、常驻零 CPU）
notify = "8"
# 阶段 4.2：PSD 内容缩略图（解文件内嵌合成图；image 0.25 已移除 psd feature，无 Adobe 依赖）
psd = "0.3"
# 阶段 4.2：SVG 内容缩略图（usvg 解析 + tiny-skia 渲染，Linebender 维护，Apache-2.0 OR MIT）
resvg = "0.47"

[dev-dependencies]
tempfile = "3"
