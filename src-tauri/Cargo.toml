[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
drag = "2.1.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
# 无边框窗口恢复 DWM 阴影（MIT）
window-shadows = "0.2"
# window-shadows 0.2 基于 rwh 0.5（tauri 为 0.6，类型不通用），需手动构造句柄传入
raw-window-handle = "0.5"
# DWM 圆角偏好设置（消除 DWM 8px 圆角与自绘 12px 圆角重叠）
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }
