[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
drag = "2.1.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-dialog = "2"
# 主窗口 1px 线框色（DWMWA_BORDER_COLOR，Win11+）+ 收件箱盘符（DefineDosDeviceW，3.2）
# + 收件箱占用探测（CreateFileW 的 SECURITY_ATTRIBUTES 参数要求 Win32_Security，3.2）
# + 4.2 格式图标保底（IShellItemImageFactory 取系统图标 → GetDIBits 转 RGBA；COM 初始化为 STA）
# + 预览窗口"默认程序打开"（ShellExecuteW；SW_SHOW 在 Win32_UI_WindowsAndMessaging）
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com"] }
# 数据层：时间戳（ID / importedAt / 备份命名）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 数据层：ID 随机字符
rand = "0.8"
# 全局配置目录（Windows %APPDATA%）
dirs = "5"
# 阶段 3：导入 hash 查重（sha256）
sha2 = "0.10"
# 阶段 3：图片宽高探测与缩略图生成（裁剪特性控制体积）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# 阶段 3：有损 webp 缩略图编码（libwebp 官方绑定 q=80；image crate 的 WebPEncoder 只支持无损，体积差 5 倍）
webp = { version = "0.3", default-features = false }
# 阶段 3：剪贴板图片读取（剪贴板导入）
arboard = "3"
# 1.3：新建文档软件图标 data URL（PNG → base64）
base64 = "0.22"
# 阶段 3：导入管线并行（sha256 / 复制 / 缩略图多线程，rayon 数据并行标准方案）
rayon = "1"
# 阶段 3.2：收件箱目录监听（Windows 走 ReadDirectoryChangesW 增量事件，非轮询、常驻零 CPU）
notify = "8"
# 阶段 4.2：PSD 内容缩略图（解文件内嵌合成图；image 0.25 已移除 psd feature，无 Adobe 依赖）
psd = "0.3"
# 阶段 4.2：SVG 内容缩略图（usvg 解析 + tiny-skia 渲染，Linebender 维护，Apache-2.0 OR MIT）
resvg = "0.47"
# 阶段 5.1：WEBP 动图逐帧解码（image crate 的门面未暴露动画 API，直接用其底层实现；
# 纯 Rust 无 C 依赖，is_animated / num_frames / duration_ms / read_frame）
image-webp = "0.2"

[dev-dependencies]
tempfile = "3"

# dev 构建优化（2026-07-26 实测定位，动图帧条 5-10 秒根因）：
# 纯 debug（opt-level 0）图像解码 / 重采样慢 10-30 倍（1080p webp 帧条 725ms/帧）。
# 自身 crate O1：image crate 的 imageops::resize 是泛型函数，在调用方（我们）单态化编译，
# 只优化依赖 crate 管不到它；O1 对数值重采样提升一个量级，编译速度损失可忽略
[profile.dev]
opt-level = 1

# 全部依赖 O2（解码链在依赖 crate 内的部分：webp/png/psd 解码等）；
# 依赖只编一次，不影响日常增量构建；release 不受影响
[profile.dev.package."*"]
opt-level = 2
