[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
drag = "2.1.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-dialog = "2"
# 主窗口 1px 线框色（DWMWA_BORDER_COLOR，Win11+）
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }
# 数据层：时间戳（ID / importedAt / 备份命名）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 数据层：ID 随机字符
rand = "0.8"
# 全局配置目录（Windows %APPDATA%）
dirs = "5"
# 阶段 3：导入 hash 查重（sha256）
sha2 = "0.10"
# 阶段 3：图片宽高探测与缩略图生成（裁剪特性控制体积）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# 阶段 3：有损 webp 缩略图编码（libwebp 官方绑定 q=80；image crate 的 WebPEncoder 只支持无损，体积差 5 倍）
webp = { version = "0.3", default-features = false }
# 阶段 3：剪贴板图片读取（剪贴板导入）
arboard = "3"

[dev-dependencies]
tempfile = "3"
