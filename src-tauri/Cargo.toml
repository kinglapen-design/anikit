[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.80"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
drag = "2.1.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-dialog = "2"
# 主窗口 1px 线框色（DWMWA_BORDER_COLOR，Win11+）+ 收件箱盘符（DefineDosDeviceW，3.2）
# + 收件箱占用探测（CreateFileW 的 SECURITY_ATTRIBUTES 参数要求 Win32_Security，3.2）
# + 4.2 格式图标保底（IShellItemImageFactory 取系统图标 → GetDIBits 转 RGBA；COM 初始化为 STA）
# + 预览窗口"默认程序打开"（ShellExecuteW；SW_SHOW 在 Win32_UI_WindowsAndMessaging）
# + 5.3 帧流节奏（timeBeginPeriod(1) 定时粒度提升，踩坑 040；Win32_Media）
# + 5.6 字体安装（HKCU 注册表 Fonts 项读写，Win32_System_Registry）
# + 7.1 窗口框架延伸（DwmExtendFrameIntoClientArea 的 MARGINS，Win32_UI_Controls；
#   失焦态角弧带非客户区穿透修复，踩坑 063 六轮）
# + 8.3 发送至 AN（Flash 11 Picture 私有剪贴板写入：RegisterClipboardFormatW / SetClipboardData
#   = Win32_System_DataExchange，GlobalAlloc/Lock = Win32_System_Memory）
# + 工作空间「系统菜单」（IContextMenu 原生右键菜单：SHParseDisplayName / SHGetDesktopFolder /
#   TrackPopupMenuEx 在已有 Win32_UI_Shell + Win32_UI_WindowsAndMessaging 内；消息转发窗口的
#   类注册 hInstance 取模块句柄 = Win32_System_LibraryLoader）
# + 工作空间「外部文件夹挂进 WS」（junction 目录联接：DeviceIoControl = Win32_System_IO，
#   FSCTL_SET/GET_REPARSE_POINT 常量 = Win32_System_Ioctl）
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Media", "Win32_System_Registry", "Win32_UI_Controls", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_IO", "Win32_System_Ioctl"] }
# 数据层：时间戳（ID / importedAt / 备份命名）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 数据层：ID 随机字符
rand = "0.8"
# 全局配置目录（Windows %APPDATA%）
dirs = "5"
# 阶段 3：导入 hash 查重（sha256）
sha2 = "0.10"
# 阶段 3：图片宽高探测与缩略图生成（裁剪特性控制体积）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# 阶段 3：有损 webp 缩略图编码（libwebp 官方绑定 q=80；image crate 的 WebPEncoder 只支持无损，体积差 5 倍）
webp = { version = "0.3", default-features = false }
# 阶段 3：剪贴板图片读取（剪贴板导入）
arboard = "3"
# 1.3：新建文档软件图标 data URL（PNG → base64）
base64 = "0.22"
# 阶段 3：导入管线并行（sha256 / 复制 / 缩略图多线程，rayon 数据并行标准方案）
rayon = "1"
# 阶段 3.2：收件箱目录监听（Windows 走 ReadDirectoryChangesW 增量事件，非轮询、常驻零 CPU）
notify = "8"
# 阶段 4.2：PSD 内容缩略图（解文件内嵌合成图；image 0.25 已移除 psd feature，无 Adobe 依赖）
psd = "0.3"
# 阶段 4.2：SVG 内容缩略图（usvg 解析 + tiny-skia 渲染，Linebender 维护，Apache-2.0 OR MIT）
resvg = "0.47"
# 阶段 5.1：WEBP 动图逐帧解码（image crate 的门面未暴露动画 API，直接用其底层实现；
# 纯 Rust 无 C 依赖，is_animated / num_frames / duration_ms / read_frame）
image-webp = "0.2"
# 阶段四：自研解码器（GIF/视频帧流；动图 webp 归 image-webp——lgpl 构建无 libwebp decoder）
# 编译前置：tools/libclang（pip）+ src-tauri/vendor/ffmpeg（tools/fetch-ffmpeg.py --dev-lib）
ffmpeg-next = "8"
# 阶段四：帧流 WS 推（tokio-tungstenite；tokio 运行时复用 tauri async_runtime）
tokio = { version = "1", features = ["net", "sync", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
# 5.6：字体元数据解析（name 表 / cmap / num_glyphs / ttc 枚举）+ 缩略图样张光栅化（fontdue 纯 Rust）
ttf-parser = "0.25"
fontdue = "0.9"
# 5.6：文本资产读取 GBK 回退（Windows 中文用户 txt 常态 ANSI；读 UTF-8 优先、写恒 UTF-8）
encoding_rs = "0.8"
# 8.3 发送至 AN：fla（XFL zip）读取 + Flash 11 Picture 剪贴板载荷打包（deflate 默认特性）
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# 2026-09-26 提示词轮：PNG zTXt / iTXt 压缩文本 inflate（已在 Cargo.lock 经 zip 传递引入，
# 提为直接依赖不改版本；rust_backend 纯 Rust 无 C 依赖，离线安全）
flate2 = "1.1"
# 8.3 发送至 AN：DOMDocument.xml 事件流改写（读写事件保属性顺序；XML 树库会丢序）
quick-xml = "0.36"
# AI 外接通道（MCP 一期，PRD 08-06）：官方 Rust SDK——JSON-RPC / 会话 / 工具 schema 协商不走手写；
# ≥1.4.0 内置 Host 头校验防 DNS rebinding（CVE-2026-42559）
rmcp = { version = "3.4", features = ["transport-streamable-http-server"] }
# AI 外接通道：axum nest_service 挂载 rmcp Streamable HTTP Tower 服务（最小特性面）
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# 语义分析（PRD 08-04）：SQLite 派生索引 + 本地 CLIP（CPU / DirectML，私有 ORT 动态运行时）
rusqlite = { version = "0.38", features = ["bundled"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "api-24", "directml", "load-dynamic"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

# 阶段四 spike 同款补丁：ffmpeg-next 8.1.0 的 EXIF frame side data 门控门槛
#（avcodec minor>=28 才开 ffmpeg_8_1）滞后于实际合入（avutil 60.10 / avcodec 62.13 已含
# AV_FRAME_DATA_EXIF）→ bindgen 产物含枚举但 arm 被 cfg 掉，match 缺臂编译失败。
# 补丁 = 本副本 src/util/frame/side_data.rs 三处 cfg 由 ffmpeg_8_1 改 ffmpeg_8_0（踩坑 038）。
[patch.crates-io]
ffmpeg-next = { path = "patches/ffmpeg-next" }

[dev-dependencies]
tempfile = "3"

# dev 构建优化（2026-07-26 实测定位，动图帧条 5-10 秒根因）：
# 纯 debug（opt-level 0）图像解码 / 重采样慢 10-30 倍（1080p webp 帧条 725ms/帧）。
# 自身 crate O1：image crate 的 imageops::resize 是泛型函数，在调用方（我们）单态化编译，
# 只优化依赖 crate 管不到它；O1 对数值重采样提升一个量级，编译速度损失可忽略
# incremental = false（2026-10-01，踩坑 091 第三次复发按定案关闭）：rust 工具链升级
#（含 1.98.0→1.98.1 这种 patch）后增量缓存新旧 anon.*.llvm 符号混链 → dev 链接 LNK2019
# 几十上百连发；清 incremental 只能救当次，patch 升级每隔几周来一次——釜底抽薪关增量，
# 代价 = 每次改 Rust 全量重编本 crate（换取链接绝对可靠）
[profile.dev]
opt-level = 1
incremental = false

# 全部依赖 O2（解码链在依赖 crate 内的部分：webp/png/psd 解码等）；
# 依赖只编一次，不影响日常增量构建；release 不受影响
[profile.dev.package."*"]
opt-level = 2
