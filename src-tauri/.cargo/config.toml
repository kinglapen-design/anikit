# 编译期环境（relative = 相对本文件父目录，即 src-tauri/）
# LIBCLANG_PATH：ffmpeg-sys-next 的 bindgen 依赖（tools/libclang，pip 包，阶段四）
# FFMPEG_DIR：BtbN lgpl-shared dev 库（vendor/ffmpeg，tools/fetch-ffmpeg.py --dev-lib 可重建）
[env]
LIBCLANG_PATH = { value = "../tools/libclang/clang/native", relative = true }
FFMPEG_DIR = { value = "vendor/ffmpeg", relative = true }
